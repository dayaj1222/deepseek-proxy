# DeepSeek OpenAI Proxy configuration — source of truth.
# Precedence: process env vars override these values; else these are used.

# --- DeepSeek credentials (prefer token over email+password) ---
DEEPSEEK_TOKEN = ''
DEEPSEEK_EMAIL = 'REDACTED_EMAIL'
DEEPSEEK_PASSWORD = 'REDACTED_PASSWORD'

# Model type: DEFAULT, EXPERT, or VISION
MODEL_TYPE = "DEFAULT"

# --- Server ---
PROXY_HOST = "0.0.0.0"
PROXY_PORT = 8000

# --- Behaviour ---
# Minimum seconds from one backend request finishing to the next beginning.
REQUEST_DELAY = 2.0
TOOL_REMINDER_INTERVAL = 0
# Re-inject the original system prompt and tool definitions every N exchanges.
# Set to 0 to disable periodic system re-anchoring.
SYSTEM_PROMPT_INTERVAL = 0
TOOL_BUFFER_LIMIT = 100000
TOOL_REPAIR_MAX_RETRIES = 3
RATE_LIMIT_MAX_RETRIES = 3
RATE_LIMIT_BACKOFF_S = 10.0

# --- Tool-call dialect: THE one switch (see tool_format.py DIALECTS) ---
# "json_invoke" | "xml_params" | "dsml". Env var TOOL_FORMAT overrides this.
TOOL_FORMAT = "json_invoke"

# --- Persistence ---
STATE_PATH = "session_state.json"

# --- Logging ---
LOG_LEVEL = "INFO"
LOG_FORMAT = "pretty"
DEBUG = false

# --- Thinking / search mode (opt-in) ---
# When THINKING_ENABLED is true, ask DeepSeek to enable its internal "thinking"
# pass and route the resulting thinking text to the OpenAI reasoning_content
# channel (never into the reply text, tool-call parsing, or token counting).
# SEARCH_ENABLED similarly enables DeepSeek's web search; search fragments are
# dropped (citations already embedded in the reply text are preserved).
# Clients may override thinking per request via reasoning_effort / reasoning /
# thinking body params. When both are false (default), behaviour is unchanged.
THINKING_ENABLED = false
SEARCH_ENABLED = true

# --- Prompt templates injected by the proxy ---
# NOTE: tool-call instruction/reminder prose lives with each dialect in
# tool_format.py (it must match the taught tags).
[PROMPTS]
PROTOCOL_HEADER = "## TOOL CALL PROTOCOL — MANDATORY, STRICT FORMAT"

TOOLS_HEADER = "## Available Tools"

TOOL_SECTION = """### {name}
Description: {description}
Parameters (JSON Schema):
```json
{params}
```"""

CONTINUE_AFTER_TOOL = "Now continue with the task based on the tool result above."

ROLE_PREFIX_SYSTEM = "System: {content}"
ROLE_PREFIX_USER = "User: {content}"
ROLE_PREFIX_ASSISTANT = "Assistant: {content}"
ROLE_PREFIX_ASSISTANT_TOOL = "Assistant:\n{content}"
ROLE_PREFIX_TOOL = "Tool result (id={tool_call_id}):\n{content}"

